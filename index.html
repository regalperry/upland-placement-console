<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Upland Placement Console - Sign in</title>
<style>
:root { color-scheme: light; --bg:#f2f4f5; --card:#fff; --ink:#1b1f22; --ink-2:#5b6469; --rail:#dfe3e6; --accent:#0079c1; --bad:#d03b3b; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#1b2023; --card:#2b2b2b; --ink:#e9ebec; --ink-2:#a7afb4; --rail:#454545; --accent:#4cc2ff; --bad:#e66767; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--rail); border-radius:8px; padding:24px; }
h1 { margin:0 0 2px; font-size:18px; letter-spacing:.02em; text-transform:uppercase; }
p { margin:0 0 18px; color:var(--ink-2); font-size:12px; }
label { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px; }
input { width:100%; padding:9px 10px; border:1px solid var(--rail); border-radius:5px; background:transparent; color:inherit; font:inherit; }
button { width:100%; margin-top:14px; padding:10px; border:0; border-radius:5px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
button[disabled] { opacity:.6; cursor:progress; }
#err { color:var(--bad); font-size:12px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>
<form id="login" autocomplete="off">
  <h1>Upland Placement Console</h1>
  <p>USMA AY2027 capstone. Team access only.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Sign in</button>
  <div id="err" role="alert"></div>
</form>

const SKEY = "upc_key_" + P.s;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" },
                                 base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

/* Stay signed in for this browser tab. Wait for load: document.open() is
   ignored while this login page is still being parsed. */
window.addEventListener("load", async () => {
  try {
    const saved = sessionStorage.getItem(SKEY);
    if (!saved) return;
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
    await openWith(key);
  } catch (e) { try { sessionStorage.removeItem(SKEY); } catch (_) {} }
});

document.getElementById("login").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Checking..."; err.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pw").value);
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      sessionStorage.setItem(SKEY, btoa(String.fromCharCode(...raw)));
    } catch (_) {}
    await openWith(key);
  } catch (e) {
    try { sessionStorage.removeItem(SKEY); } catch (_) {}
    err.textContent = "Wrong password. Try again.";
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
